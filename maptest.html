<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Add a polygon to a map using a GeoJSON source</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoibWF4LW55dSIsImEiOiJjbTkxejFodHAwNm11MnNwdzEwNmZqeDl0In0.oWghXY8kwRBvRhHPCwwPhw';

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/light-v11',
            center: [-118.466, 34.065],
            zoom: 15
        });

        map.on('load', () => {
            map.addSource('custom-polygons', {
                'type': 'geojson',
                'data': {
                    'type': 'FeatureCollection',
                    'features': [
                        {
                            'type': 'Feature',
                            'properties': { 'id': 'bw_schl' },
                            'geometry': {
                                'type': 'Polygon',
                                'coordinates': [[
                                    [-118.46896614986406, 34.06581195994198],
                                    [-118.46832665739105, 34.06584650899073],
                                    [-118.46788179306196, 34.06517855822132],
                                    [-118.46771496893861, 34.06464880041959],
                                    [-118.46717279053735, 34.06448756912641],
                                    [-118.4667835342494, 34.06418813876907],
                                    [-118.4661579437869, 34.06309405731241],
                                    [-118.46554625533446, 34.063209224446354],
                                    [-118.46507358698483, 34.06372747461435],
                                    [-118.4655601573445, 34.06544343588064],
                                    [-118.46493456688201, 34.06667568193059],
                                    [-118.46683914229052, 34.06770062060042],
                                    [-118.46896614986406, 34.06581195994198]
                                ]]
                            }
                        },
                        {
                            'type': 'Feature',
                            'properties': { 'id': 'jr_stadium' },
                            'geometry': {
                                'type': 'Polygon',
                                'coordinates': [[
                                    [-118.45878018211258, 34.05983485097043],
                                    [-118.45912773236944, 34.0599730568278],
                                    [-118.45964210675012, 34.05996153968175],
                                    [-118.46083767963444, 34.05944326648448],
                                    [-118.46000355901748, 34.058660092084196],
                                    [-118.45868286804037, 34.05813029353307],
                                    [-118.45752900118711, 34.058706161366885],
                                    [-118.45851604391697, 34.059938505385105],
                                    [-118.45878018211258, 34.05983485097043]
                                ]]
                            }
                        },
                        {
                            'type': 'Feature',
                            'properties': { 'id': 'bridgeland' },
                            'geometry': {
                                'type': 'Polygon',
                                'coordinates': [[
                                    [-118.4566531757354, 34.05908622268818],
                                    [-118.45577734908778, 34.0582569754869],
                                    [-118.45574954506722, 34.05778476164912],
                                    [-118.45481811037804, 34.058222423343906],
                                    [-118.45574954506722, 34.0596160152633],
                                    [-118.4566531757354, 34.05908622268818]
                                ]]
                            }
                        }
                    ]
                }
            });

            map.addLayer({
                'id': 'custom-fill',
                'type': 'fill',
                'source': 'custom-polygons',
                'paint': {
                    'fill-color': '#FF6600',
                    'fill-opacity': 0.5
                }
            });

            map.addLayer({
                'id': 'custom-outline',
                'type': 'line',
                'source': 'custom-polygons',
                'paint': {
                    'line-color': '#000000',
                    'line-width': 2
                }
            });
        });

    </script>

</body>

</html>
